name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@8df10395026401d9b18c718ca425d9521b4bc663 # v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f66a2182c1cb73f1816f1f31f99c855cf666 # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Install Android SDK 36 & NDK 28
        run: |
          yes | flutter doctor --android-licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" || true

      - name: Verify Android Configuration
        run: |
          echo "=== Checking build.gradle.kts values ==="
          grep -n "compileSdk\|ndkVersion" android/app/build.gradle.kts

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: success()
        with:
          name: MoonReader-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk