name: AK Reader Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    name: 🚀 Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Verification Gate
        run: flutter analyze

      - name: Compile Native Release APK (ARM64)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --no-tree-shake-icons

      - name: Compile Play Store App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --no-tree-shake-icons

      - name: Prepare Tagged Binaries
        run: |
          TAG=${GITHUB_REF_NAME:-v1.0.1}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AKReader-${TAG}-arm64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/AKReader-${TAG}-release.aab"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "AK Reader Production Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Build Summary Output
        if: always()
        run: |
          echo "## 📖 AK Reader Build Status (${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 **Direct APK (ARM64)** | \`AKReader-${{ github.ref_name }}-arm64.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏬 **Play Store Bundle** | \`AKReader-${{ github.ref_name }}-release.aab\` |" >> $GITHUB_STEP_SUMMARY
